<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce HomePage</title>
  <link rel="stylesheet" href="CheckOut.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="top-bar">
    <h1>Thanh toán</h1>
    <a href="#">← Quay lại cửa hàng</a>
  </header>

  <main class="checkout-container">
    <section class="billing-form">
      <h2>Thông tin giao hàng</h2>
      <form id="checkout-form">
        <input type="text" placeholder="Họ và tên *" required>
        <input type="text" placeholder="Tên công ty (nếu có)">
        <input type="text" placeholder="Địa chỉ *" required>
        <input type="text" placeholder="Tầng, phòng (tuỳ chọn)">
        <input type="text" placeholder="Thành phố *" required>
        <input type="tel" placeholder="Số điện thoại *" required>
        <input type="email" placeholder="Email *" required>
        <label><input type="checkbox"> Lưu thông tin cho lần sau</label>
      </form>
    </section>

    <section class="order-summary">
      <h2>Đơn hàng</h2>
      <div id="order-items"></div>
      <p>Vận chuyển: <strong>Miễn phí</strong></p>
      <p class="total">Tổng: <strong id="order-total">$0</strong></p>

    <div class="payment-method">
        <label><input type="radio" name="payment" value="bank" checked onchange="toggleCardForm()"> Chuyển khoản</label><br>
        <label><input type="radio" name="payment" value="cod" onchange="toggleCardForm()"> Thanh toán khi nhận</label>
    </div>

    <div id="card-form">
        <label>Loại thẻ:</label>
        <select id="card-type">
        <option value="visa">Visa</option>
        <option value="mastercard">Mastercard</option>
        </select>

        <label>Tên chủ thẻ:</label>
        <input type="text" id="card-name" placeholder="NGUYEN VAN A" oninput="formatCardName(this)">

        <label>Số thẻ:</label>
        <input type="text" id="card-number" placeholder="XXXX-XXXX-XXXX" maxlength="14" oninput="formatCardNumber(this)">

        <label>CVV:</label>
        <input type="text" id="card-cvv" placeholder="xxx" maxlength="3" oninput="formatCardNumber(this)">
    </div>


    <div class="coupon">
        <input type="text" placeholder="Mã giảm giá">
        <button>Áp dụng</button>
    </div>

      <button class="btn-primary" onclick="placeOrder()">Đặt hàng</button>
    </section>
  </main>

  <script src="CheckOut.js"></script>
</body>
</html>
